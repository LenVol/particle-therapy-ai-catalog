    has_code: true
    readme_excerpt: >
      PROTOTWIN-PET Washout is part of the PROTOTWIN project, which aims to guide proton therapy using PET imaging, in this case by improving dose verification and biological tumor characterization.
  - url: https://github.com/AndreasSmolders/DIRUncertainty
    always_include: true
    platform: github
    full_name: AndreasSmolders/DIRUncertainty
    description: This repository contains code to predict the uncertainty of a given deformable vector field. It also contains code to use that uncertainty to generate contouring uncertainty or dose accumulation uncertainty. Up until now, the code was designed for CT-to-CT registration, and will likely not work for other registrations. CT-to-syntheticCT should also work, but it was never tested.
    language: python
    topics:
      - deformable image registration
      - uncertainty 
      - deep learning 
      - unsupervised learning
    note: 
    tags:
      - deformable image registration
      - uncertainty 
      - deep learning 
      - unsupervised learning
    has_code: true
    readme_excerpt: >
      This repository contains code to predict the uncertainty of a given deformable vector field. Up until now, the code was designed for CT-to-CT registration, and will likely not work for other registrations. CT-to-syntheticCT should also work, but it was never tested.
